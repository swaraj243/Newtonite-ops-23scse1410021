services:
  postgres:
    image: postgres:16-alpine
    container_name: newtonite-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-newtonite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newtonite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-newtonite_ops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-newtonite} -d ${POSTGRES_DB:-newtonite_ops}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
